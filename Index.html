.bl.g{color:var(--okd);border-bottom-style:solid}
.o{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt,.tk{background:var(--p2);border:2px solid var(--p);border-radius:16px;padding:12px;font-weight:800;font-size:1.05rem}
.opt:hover:not(:disabled),.tk:hover:not(:disabled){background:var(--p)}
.opt.ok{background:var(--ok);border-color:var(--okd);color:var(--okd)}
.opt.ko{background:var(--ko);border-color:var(--kod);color:var(--kod);animation:sk .3s}

.tk.u{opacity:.3}
.fb{margin-top:16px;border-radius:18px;padding:14px;animation:pp .25s}
.fb.ok{background:var(--ok);color:var(--okd)}.fb.ko{background:var(--ko);color:var(--kod)}
.fb p{margin:6px 0 12px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.end{text-align:center}.end .em{font-size:4rem}.end h2{font:700 1.8rem Fredoka,system-ui,sans-serif;color:var(--pd);margin:4px 0}
details.ch{margin-top:18px;background:var(--card);border-radius:18px;padding:10px 16px;box-shadow:var(--sh)}
summary{cursor:pointer;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
td{padding:6px;border-top:1px solid var(--p2);vertical-align:top}td:first-child{font-weight:800;color:var(--pd);white-space:nowrap}
footer{text-align:center;color:var(--mut);margin:26px 0 8px}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pp{from{transform:scale(.96);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
